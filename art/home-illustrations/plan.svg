      <line x1="262" y1="196" x2="278" y2="196" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="262" y1="196" x2="268.2" y2="202.2" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="262" y1="196" x2="262" y2="212" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="262" y1="196" x2="255.8" y2="202.2" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="262" y1="196" x2="246" y2="196" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="262" y1="196" x2="255.8" y2="189.8" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="262" y1="196" x2="262" y2="180" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="262" y1="196" x2="268.2" y2="189.8" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>

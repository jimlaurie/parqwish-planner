      <line x1="208" y1="86" x2="220" y2="98" stroke="#2B2D42" stroke-width="1.5"/>
      <circle cx="220" cy="98" r="4" fill="#D9573F" stroke="#2B2D42" stroke-width="1.2"/>
      <line x1="208" y1="86" x2="196" y2="98" stroke="#2B2D42" stroke-width="1.5"/>
      <circle cx="196" cy="98" r="4" fill="#2F9C95" stroke="#2B2D42" stroke-width="1.2"/>
      <line x1="208" y1="86" x2="196" y2="74" stroke="#2B2D42" stroke-width="1.5"/>
      <circle cx="196" cy="74" r="4" fill="#E3A93A" stroke="#2B2D42" stroke-width="1.2"/>
      <line x1="208" y1="86" x2="220" y2="74" stroke="#2B2D42" stroke-width="1.5"/>
      <circle cx="220" cy="74" r="4" fill="#E07A3F" stroke="#2B2D42" stroke-width="1.2"/>

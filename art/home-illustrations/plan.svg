    <path d="M112 228 L146 250" stroke="#2F9C95" stroke-width="8" stroke-linecap="round" fill="none"/>
    <line x1="146" y1="243" x2="160" y2="262" stroke="#E3A93A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="148" cy="251" r="4.5" fill="#EFC29C" stroke="#2B2D42" stroke-width="1.5"/>

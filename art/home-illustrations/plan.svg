    <line id="list-line-1" x1="168" y1="282" x2="196" y2="282" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round"/>
    <line id="list-line-2" x1="168" y1="297" x2="190" y2="297" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round"/>
    <line id="list-line-3" x1="168" y1="312" x2="198" y2="312" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round"/>
    <line id="list-line-4" x1="168" y1="327" x2="186" y2="327" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round"/>
    <polygon id="list-star-1" points="158,277 159.3,280.2 162.8,280.5 160.1,282.7 160.9,286 158,284.2 155.1,286 155.9,282.7 153.2,280.5 156.7,280.2" fill="#E3A93A" stroke="#2B2D42" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon id="list-star-2" points="158,292 159.3,295.2 162.8,295.5 160.1,297.7 160.9,301 158,299.2 155.1,301 155.9,297.7 153.2,295.5 156.7,295.2" fill="#E3A93A" stroke="#2B2D42" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon id="list-star-3" points="158,307 159.3,310.2 162.8,310.5 160.1,312.7 160.9,316 158,314.2 155.1,316 155.9,312.7 153.2,310.5 156.7,310.2" fill="#E3A93A" stroke="#2B2D42" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon id="list-star-4" points="158,322 159.3,325.2 162.8,325.5 160.1,327.7 160.9,331 158,329.2 155.1,331 155.9,327.7 153.2,325.5 156.7,325.2" fill="#E3A93A" stroke="#2B2D42" stroke-width="1.2" stroke-linejoin="round"/>

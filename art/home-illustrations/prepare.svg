<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <title>Prepare — packing a suitcase in front of the wardrobe</title>
  <g id="room">
    <rect id="wall" width="300" height="400" fill="#F1E6CF"/>
    <rect id="floor" y="350" width="300" height="50" fill="#D8C29C"/>
    <line id="baseboard" x1="0" y1="350" x2="300" y2="350" stroke="#2B2D42" stroke-width="3"/>
  </g>
  <g id="decorations">
    <g id="starburst">
      <line x1="250" y1="150" x2="268" y2="150" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="250" y1="150" x2="257" y2="157" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="250" y1="150" x2="250" y2="168" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="250" y1="150" x2="243" y2="157" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="250" y1="150" x2="232" y2="150" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="250" y1="150" x2="243" y2="143" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="250" y1="150" x2="250" y2="132" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="250" y1="150" x2="257" y2="143" stroke="#E3A93A" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="250" cy="150" r="2.5" fill="#E3A93A"/>
    </g>
    <path id="sparkle" d="M200 53 Q201.5 58.5 207 60 Q201.5 61.5 200 67 Q198.5 61.5 193 60 Q198.5 58.5 200 53 Z" fill="#E3A93A"/>
  </g>
  <g id="wardrobe">
    <path id="door-left" d="M22 100 L6 110 L6 326 L22 334 Z" fill="#7FA97C" stroke="#2B2D42" stroke-width="2.5" stroke-linejoin="round"/>
    <path id="door-right" d="M126 100 L142 110 L142 326 L126 334 Z" fill="#7FA97C" stroke="#2B2D42" stroke-width="2.5" stroke-linejoin="round"/>
    <rect id="cabinet" x="22" y="96" width="104" height="240" rx="4" fill="#7FA97C" stroke="#2B2D42" stroke-width="3"/>
    <rect id="inside" x="30" y="104" width="88" height="224" rx="2" fill="#2B2D42"/>
    <line id="rail" x1="34" y1="122" x2="114" y2="122" stroke="#E3A93A" stroke-width="3" stroke-linecap="round"/>
    <path id="hangers" d="M48 122 L56 114 L64 122 M72 122 L80 114 L88 122 M96 122 L104 114 L112 122" fill="none" stroke="#FFF9EC" stroke-width="2"/>
    <path id="dress" d="M50 124 L62 124 L70 196 L42 196 Z" fill="#D9573F"/>
    <path id="shirt" d="M72 124 L88 124 L96 136 L90 140 L90 178 L70 178 L70 140 L64 136 Z" fill="#2F9C95"/>
    <path id="jacket" d="M96 124 L112 124 L116 210 L92 210 Z" fill="#E07A3F"/>
    <line x1="30" y1="336" x2="26" y2="350" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>
    <line x1="118" y1="336" x2="122" y2="350" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g id="suitcase">
    <path id="lid" d="M192 302 L200 248 L286 248 L282 302 Z" fill="#E07A3F" stroke="#2B2D42" stroke-width="2.5" stroke-linejoin="round"/>
    <path id="lid-handle" d="M232 248 L234 240 L252 240 L254 248" fill="none" stroke="#2B2D42" stroke-width="3"/>
    <g id="packed-shirt">
      <rect x="200" y="286" width="32" height="16" rx="2" fill="#2F9C95" stroke="#2B2D42" stroke-width="2"/>
    </g>
    <g id="packed-hat">
      <ellipse cx="258" cy="296" rx="18" ry="5" fill="#E3A93A" stroke="#2B2D42" stroke-width="2"/>
      <path d="M248 296 Q248 280 258 280 Q268 280 268 296 Z" fill="#E3A93A" stroke="#2B2D42" stroke-width="2"/>
    </g>
    <g id="packed-sunglasses">
      <circle cx="226" cy="290" r="6" fill="#2B2D42"/>
      <circle cx="242" cy="290" r="6" fill="#2B2D42"/>
      <line x1="232" y1="289" x2="236" y2="289" stroke="#2B2D42" stroke-width="2"/>
    </g>
    <rect id="base" x="186" y="300" width="100" height="50" rx="6" fill="#D9573F" stroke="#2B2D42" stroke-width="3"/>
    <line id="strap-left" x1="210" y1="300" x2="210" y2="350" stroke="#2B2D42" stroke-width="2"/>
    <line id="strap-right" x1="262" y1="300" x2="262" y2="350" stroke="#2B2D42" stroke-width="2"/>
    <g id="luggage-tag">
      <line x1="286" y1="312" x2="292" y2="322" stroke="#2B2D42" stroke-width="1.5"/>
      <rect x="284" y="322" width="14" height="20" rx="2" fill="#FFF9EC" stroke="#2B2D42" stroke-width="2"/>
    </g>
  </g>
  <g id="character">
    <rect id="leg-back" x="150" y="298" width="8" height="50" fill="#2B2D42"/>
    <rect id="leg-front" x="168" y="298" width="8" height="50" fill="#2B2D42"/>
    <ellipse id="shoe-back" cx="158" cy="349" rx="10" ry="4" fill="#2B2D42"/>
    <ellipse id="shoe-front" cx="178" cy="349" rx="10" ry="4" fill="#2B2D42"/>
    <path id="arm-back" d="M146 246 L134 286" stroke="#2F9C95" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path id="body" d="M142 302 L148 238 Q162 228 178 238 L184 302 Z" fill="#2F9C95" stroke="#2B2D42" stroke-width="2.5" stroke-linejoin="round"/>
    <circle id="face" cx="164" cy="214" r="16" fill="#EFC29C" stroke="#2B2D42" stroke-width="2.5"/>
    <path id="hair" d="M148 212 Q148 194 166 195 Q180 197 180 208 Q168 202 156 210 Z" fill="#2B2D42"/>
    <circle id="eye" cx="173" cy="214" r="2" fill="#2B2D42"/>
    <g id="packing-arm">
      <path d="M176 244 L200 262" stroke="#2F9C95" stroke-width="8" stroke-linecap="round" fill="none"/>
      <rect x="196" y="258" width="22" height="12" rx="2" fill="#E3A93A" stroke="#2B2D42" stroke-width="2"/>
      <circle cx="201" cy="264" r="4.5" fill="#EFC29C" stroke="#2B2D42" stroke-width="1.5"/>
    </g>
  </g>
</svg>
